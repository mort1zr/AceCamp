# Configuración del pipeline. Las rutas son relativas a la carpeta model/.
# Cualquier valor se puede sobrescribir por línea de comandos (python main.py --help).

paths:
  input: input_videos/input_video.mp4
  output: output_videos/output_video.avi
  cache_dir: cache
  # Informe del partido (TA-30): report.json y points.csv. Se escribe en cada ejecución.
  report_dir: output_videos/informe

models:
  # Detector de jugadores (los descarga scripts/download_models.py). Con el vídeo de ejemplo en CPU,
  # yolov8m tarda un 39 % menos que yolov8x (700 frente a 1145 s por minuto de vídeo) y da las mismas
  # estadísticas salvo un 1-2 % en el desplazamiento del jugador del fondo.
  # Para la máxima precisión: models/yolov8x.pt
  players: models/yolov8m.pt
  ball: models/yolo5_last.pt
  court_keypoints: models/keypoints_model.pth
  # Detector de pelota TrackNet (TA-14b): solo se usa con detection.ball_detector: tracknet.
  ball_tracknet: models/tracknet.pt

detection:
  # Dispositivo para la inferencia: null (automático), cpu, cuda:0, mps...
  device: null
  # Detector de la pelota: yolo (models.ball) o tracknet (models.ball_tracknet, en evaluación
  # en TA-14b: mira 3 fotogramas seguidos y ve mejor la pelota borrosa).
  ball_detector: yolo
  ball_confidence: 0.15
  # Tamaño al que se reescala cada fotograma para buscar la pelota: auto, null (640, el de YOLO)
  # o un número. Con auto, los vídeos de menos de 1280 px de ancho se analizan a 1280: en 640x360
  # la pelota mide 2-3 px y a 640 el detector la pierde (en h2, 45 % frente a 81 % de fotogramas).
  # A 1280 la detección de la pelota tarda unas 4 veces más; los vídeos de 1080p no cambian.
  ball_image_size: auto
  # Huecos sin pelota de hasta estos fotogramas se interpolan; los más largos no.
  ball_max_interpolation_gap: 5
  # Detectar jugadores en uno de cada N fotogramas e interpolar el resto (la pelota, en todos).
  # 1 = en todos. Con 2, el vídeo de ejemplo tardó un 8 % menos, pero la distancia recorrida baja
  # un poco (la interpolación en línea recta pierde los desvíos): solo para partidos completos.
  player_every_n_frames: 1

court:
  # Volver a detectar los puntos clave de la pista cada N fotogramas.
  redetect_every_frames: 30
  # Peso de cada nueva detección en la media móvil (0 = no cambia, 1 = sin suavizar).
  smoothing: 0.3
  # Ajustar cada punto clave al cruce de líneas blancas más cercano.
  refine_keypoints: true

cameras:
  # Detectar cortes de cámara y repeticiones (TA-15): fuera de la cámara principal no se analiza.
  detect_cuts: true
  # Cuánto puede desplazarse la pista respecto a su posición habitual (fracción del ancho del
  # fotograma) para seguir contando como cámara principal.
  max_shift_fraction: 0.08

line_calls:
  # Dentro, fuera o dudoso de cada bote (TA-24). Un bote a menos de este margen de una línea
  # (por dentro o por fuera) es dudoso: la posición no basta para decidir. En un saque, un
  # dudoso no cuenta como falta.
  doubt_margin_m: 0.15
  # Comparar los botes del peloteo con la pista de dobles (true) o la de individuales (false).
  doubles: false

match:
  # Cómo empieza el partido (TA-29). Se puede sobrescribir con --match-config match.yaml.
  # Sacador del primer punto del vídeo: 1 (fondo lejano), 2 (cercano) o auto (el que detecta el modelo).
  first_server: auto
  best_of: 3
  games_per_set: 6
  tiebreak_points: 7
  match_tiebreak_points: 10
  no_ad: false
  # Último set: tiebreak (a 7), advantage (sin tie-break) o match_tiebreak (super tie-break a 10).
  final_set: tiebreak
  # Marcador al empezar el vídeo, si empieza a mitad de partido. Ejemplo:
  #   initial_score: {sets: [[6, 4]], games: [2, 1], points: ["30", "15"], server: 1}
  initial_score: null

worker:
  # Duración máxima del vídeo que acepta el worker, en segundos. Los más largos pasan a
  # 'error' antes de cargarlos (PCIT-147). Se puede subir cuando haya procesamiento por tramos.
  max_duration_seconds: 60
  # Mínimo de 720 píxeles en el lado corto y su equivalente 16:9 en el lado largo (1280).
  # Se admiten ambas orientaciones. El valor 0 desactiva la comprobación de resolución.
  min_resolution: 720
  # Fotogramas por segundo admitidos por el worker (ambos extremos incluidos).
  min_fps: 25
  max_fps: 60
