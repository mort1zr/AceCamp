name: Web CI

# Lint, tests, build y pruebas de reglas de la web (PCIT-164).
# Se ejecuta cuando cambia la web, las reglas de Firebase o la propia CI.
on:
  pull_request:
    paths:
      - "web/**"
      - "firebase/**"
      - "firebase.json"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "firebase/**"
      - "firebase.json"
      - ".github/workflows/web-ci.yml"
  # Lo reutiliza deploy-web.yml antes de publicar.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-tests-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm ci instala exactamente lo del package-lock (sin actualizar nada).
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Lint (oxlint)
        run: npm run lint

      - name: Tests (vitest)
        run: npm test

      - name: Build (vite)
        run: npm run build

      # La CSP de firebase.json debe permitir los scripts en línea del build (PCIT-169).
      - name: Comprobar la CSP
        run: npm run check:csp

  reglas:
    # Reglas de Firestore y Storage contra los emuladores (PCIT-23, PCIT-24, PCIT-39).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Los emuladores de Firebase necesitan Java 21.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Caché de los emuladores
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('web/package-lock.json') }}

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      # Incluye la puerta de cobertura (PCIT-212): cada `allow` de firestore.rules
      # tiene que evaluarse en la matriz de acceso, o la PR falla.
      - name: Pruebas de reglas (emuladores)
        run: npm run test:rules

      - name: Informe de cobertura de las reglas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-reglas-firestore
          path: web/rules-coverage/
          if-no-files-found: ignore
          retention-days: 14
