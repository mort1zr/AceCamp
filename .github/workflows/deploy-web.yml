name: Deploy web

# Despliegue continuo en Firebase Hosting (PCIT-169, PCIT-55):
# - en cada PR: URL de vista previa que dura 7 días, comentada en la PR;
# - al fusionar en main: producción (canal live) y reglas de Firestore y Storage.
# Antes de publicar se ejecuta la CI de la web completa (lint, tests, build y reglas).
#
# Configuración en GitHub (ver docs/devsecops.md):
# - Secreto FIREBASE_SERVICE_ACCOUNT_ACECAM: JSON de la cuenta de servicio de despliegue.
# - Variables VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#   VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID.
#   Son públicas por diseño (van dentro del JavaScript de la web); la seguridad está en las reglas.
# Sin el secreto, el despliegue se omite con un aviso en vez de fallar.
on:
  pull_request:
    paths:
      - "web/**"
      - "firebase/**"
      - "firebase.json"
      - ".github/workflows/deploy-web.yml"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "firebase/**"
      - "firebase.json"
      - ".github/workflows/deploy-web.yml"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FIREBASE_PROJECT: acecam-e93a2

jobs:
  ci:
    uses: ./.github/workflows/web-ci.yml

  deploy:
    needs: ci
    # Las PRs desde forks no reciben secretos: no se despliegan.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Producción usa el environment "production" (se pueden exigir aprobaciones en Settings > Environments).
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    concurrency:
      group: deploy-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      checks: write # la acción de Firebase publica el resultado como check
      pull-requests: write # comentario con la URL de vista previa
    steps:
      - name: Comprobar configuración
        id: config
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACECAM }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::warning::Falta el secreto FIREBASE_SERVICE_ACCOUNT_ACECAM: no se despliega (ver docs/devsecops.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.ok == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.config.outputs.ok == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build de producción
        if: steps.config.outputs.ok == 'true'
        working-directory: web
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_USE_FIREBASE_EMULATORS: "false"
          # PCIT-198: el commit queda en <meta name="acecam-version"> del HTML publicado.
          ACECAM_VERSION: ${{ github.sha }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run check:csp

      - name: Publicar en Firebase Hosting
        id: hosting
        if: steps.config.outputs.ok == 'true'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACECAM }}
          projectId: ${{ env.FIREBASE_PROJECT }}
          # Vacío en las PRs = canal de vista previa por PR; "live" en main = producción.
          channelId: ${{ github.event_name != 'pull_request' && 'live' || '' }}
          expires: 7d
          # La misma versión de firebase-tools que web/package-lock.json.
          firebaseToolsVersion: 15.34.2

      # PCIT-199: comprobar que producción responde y sirve el commit recién publicado.
      # Reintenta unos segundos por la caché del CDN; si no, el despliegue falla.
      - name: Comprobar la web publicada
        id: check
        if: steps.config.outputs.ok == 'true' && github.event_name != 'pull_request'
        working-directory: web
        env:
          EXPECTED_VERSION: ${{ github.sha }}
        run: node scripts/checkDeploy.mjs "https://${FIREBASE_PROJECT}.web.app/" "$EXPECTED_VERSION"

      # Las reglas solo se publican desde main y después de pasar test:rules en la CI.
      # Storage exige el plan Blaze: sus reglas solo se publican con la variable de
      # repositorio DEPLOY_STORAGE_RULES = true. Sin ella (plan Spark) se publican
      # solo las de Firestore, en vez de fallar todo el paso.
      - name: Publicar reglas e índices
        id: rules
        if: steps.config.outputs.ok == 'true' && github.event_name != 'pull_request'
        working-directory: web
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACECAM }}
          DEPLOY_STORAGE_RULES: ${{ vars.DEPLOY_STORAGE_RULES }}
        run: |
          key_file="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$key_file"
          chmod 600 "$key_file"
          trap 'rm -f "$key_file"' EXIT
          targets="firestore:rules,firestore:indexes"
          if [ "$DEPLOY_STORAGE_RULES" = "true" ]; then
            targets="$targets,storage"
          else
            echo "::notice::Reglas de Storage omitidas (requieren el plan Blaze). Define DEPLOY_STORAGE_RULES=true para publicarlas."
          fi
          GOOGLE_APPLICATION_CREDENTIALS="$key_file" npx --no-install firebase deploy \
            --only "$targets" \
            --project "$FIREBASE_PROJECT" --non-interactive --config ../firebase.json

      # PCIT-200: tabla con lo que se publicó en la página del run, también si algo falló.
      - name: Resumen del despliegue
        if: always() && steps.config.outputs.ok == 'true'
        working-directory: web
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRODUCTION_URL: https://${{ env.FIREBASE_PROJECT }}.web.app/
          PREVIEW_URL: ${{ steps.hosting.outputs.details_url }}
          VERSION: ${{ github.sha }}
          HOSTING_OUTCOME: ${{ steps.hosting.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          RULES_OUTCOME: ${{ steps.rules.outcome }}
          DEPLOY_STORAGE_RULES: ${{ vars.DEPLOY_STORAGE_RULES }}
        run: node scripts/deploySummary.mjs
