<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>AceCam · Estadísticas de tenis a partir de tus videos</title>
    <meta
      name="description"
      content="Sube un video o pega un link de YouTube y AceCam mide saques, golpes y movimiento. Reportes por jugador para entrenadores y reclutadores universitarios."
    />
    <meta name="theme-color" content="#12110F" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AceCam" />
    <meta property="og:locale" content="es_PE" />
    <meta
      property="og:title"
      content="AceCam · Estadísticas de tenis a partir de tus videos"
    />
    <meta
      property="og:description"
      content="Convierte cualquier partido en estadísticas de nivel profesional. Sin cámaras especiales ni hardware."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="AceCam · Estadísticas de tenis a partir de tus videos"
    />
    <meta
      name="twitter:description"
      content="Convierte cualquier partido en estadísticas de nivel profesional. Sin cámaras especiales ni hardware."
    />

    <script>
      try {
        if (localStorage.getItem('acecam-theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
        }
        if (localStorage.getItem('acecam-lang') === 'en') {
          document.documentElement.lang = 'en'
        }
      } catch {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
