name: CodeQL

# Análisis estático de seguridad (SAST) del código JavaScript, Python y de los
# propios workflows de GitHub Actions (PCIT-165). Los hallazgos aparecen en
# Security > Code scanning. Gratis porque el repositorio es público.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 14 * * 3" # miércoles 09:41 en Lima
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analizar:
    name: Analizar (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # subir los resultados a Code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Consultas de seguridad y de calidad (más hallazgos que el conjunto por defecto).
          queries: security-extended
          config: |
            paths-ignore:
              - web/dist
              - "**/node_modules"
              - model/models

      - name: Analizar
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
