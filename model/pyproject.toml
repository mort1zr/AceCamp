[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Errores reales (pyflakes y errores de sintaxis/estilo graves) y orden de imports.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["config", "constants", "court", "court_line_detector", "eval", "mini_court", "scoring", "stats", "trackers", "utils", "worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
