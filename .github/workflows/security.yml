name: Seguridad

# Análisis de seguridad continuo (PCIT-165):
# - secretos en todo el historial (gitleaks);
# - vulnerabilidades conocidas en las dependencias de Python (pip-audit) y de la web (npm audit);
# - en cada PR, Dependency Review bloquea dependencias nuevas con vulnerabilidades altas.
# Corre en cada PR, en cada push a main y cada lunes, para detectar avisos nuevos
# aunque nadie suba código.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * 1" # lunes 08:17 en Lima
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # gitleaks comenta en la PR la línea con el secreto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # todo el historial, no solo el último commit
          persist-credentials: false

      - name: Buscar secretos (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencias-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/requirements*.txt

      # Se instala el mismo entorno que el worker (torch de CPU para no bajar varios GB)
      # y se audita lo instalado, incluidas las dependencias indirectas.
      - name: Instalar el entorno del worker
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1
          pip install -r model/requirements-worker.txt -r model/requirements-dev.txt
          pip install pip-audit==2.10.1

      - name: Auditar (pip-audit)
        run: |
          pip-audit --progress-spinner off -f json -o pip-audit.json || true
          python .github/scripts/pip_audit_gate.py pip-audit.json

  dependencias-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Bloquea por vulnerabilidades altas o críticas en lo que llega al navegador.
      - name: Auditar dependencias de producción (npm audit)
        run: npm audit --omit=dev --audit-level=high

      # Las de desarrollo (firebase-tools, vitest...) no llegan a producción: solo se informan.
      - name: Informar dependencias de desarrollo
        run: npm audit --audit-level=critical || echo "::warning::npm audit encontró vulnerabilidades críticas en dependencias de desarrollo"

  revision-dependencias:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # resumen en la PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
