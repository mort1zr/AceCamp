name: Modelo CI

# Solo se ejecuta cuando cambia el modelo o la propia configuración de la CI;
# las PRs que solo tocan web/ no la disparan.
# La búsqueda de secretos de todo el repo está en security.yml (PCIT-165).
on:
  pull_request:
    paths:
      - "model/**"
      - ".github/workflows/model-ci.yml"
      - ".pre-commit-config.yaml"
  push:
    branches: [main]
    paths:
      - "model/**"
      - ".github/workflows/model-ci.yml"
      - ".pre-commit-config.yaml"

permissions:
  contents: read

concurrency:
  group: model-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-y-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: model
    steps:
      # Actions fijadas a un commit (SHA); Dependabot las actualiza (PCIT-164).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/requirements*.txt

      # PyTorch para CPU (unos 200 MB en vez de varios GB con CUDA).
      # Misma versión que requirements.txt; actualizarla en PCIT-168.
      - name: Instalar PyTorch (CPU)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        # El motor de puntuación exige 100 % de cobertura (criterio de TA-27).
        run: pytest --cov=scoring --cov-fail-under=100
