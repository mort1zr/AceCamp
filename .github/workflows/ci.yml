name: Pipeline

# Pipeline único del proyecto (antes repartido en model-ci, web-ci, security, codeql,
# scorecard y deploy-web). Todo vive aquí, como jobs separados con sus dependencias
# (needs), para que quede como una sola entrada en la pestaña Actions por cada PR o push.
#
# Disparadores:
# - pull_request y push a main: valida y, en main, despliega.
# - schedule (lunes): vuelve a correr seguridad y SAST aunque nadie suba código, para
#   detectar vulnerabilidades nuevas en dependencias ya instaladas.
# - workflow_dispatch: para lanzarlo a mano.
#
# Qué se ejecuta según lo que cambió lo decide el job "cambios" (dorny/paths-filter),
# no el disparador: los jobs de modelo solo corren si cambió model/, y los de web solo
# si cambió web/ o firebase/, tanto en pull_request como en push a main (paths-filter
# compara contra la base del PR o contra el commit anterior), igual que antes de
# unificar los workflows. En schedule y workflow_dispatch no hay un "antes" con qué
# comparar, así que esos tres jobs no corren (tampoco corrían antes: model-ci y web-ci
# no tenían disparador schedule). Los jobs de seguridad, SAST y OWASP no dependen de la
# ruta: corren siempre, como antes.
#
# Configuración en GitHub (ver docs/devsecops.md):
# - Secreto FIREBASE_SERVICE_ACCOUNT_ACECAM: JSON de la cuenta de servicio de despliegue.
# - Variables VITE_FIREBASE_*, DEPLOY_STORAGE_RULES: ver docs/devsecops.md.
# - Checks obligatorios en la protección de main: ver la lista al final de ese documento.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * 1" # lunes 08:17 en Lima
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FIREBASE_PROJECT: acecam-e93a2

jobs:
  # ------------------------------------------------------------------ qué cambió
  cambios:
    name: Detectar cambios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modelo: ${{ steps.filtro.outputs.modelo }}
      web: ${{ steps.filtro.outputs.web }}
    steps:
      # fetch-depth: 0 (historial completo): con el valor por defecto (1, superficial)
      # paths-filter no tiene con qué comparar en push/schedule y el job falla, lo que
      # saltaría en cascada todos los jobs que dependen de "cambios".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # continue-on-error: en schedule/workflow_dispatch no hay un "antes" claro que
      # comparar y el paso puede fallar; da igual, porque entonces sus outputs quedan
      # vacíos (falsy) y los jobs de modelo/web simplemente no corren en esos eventos,
      # que es el resultado correcto (ver el comentario de disparadores, arriba).
      - id: filtro
        continue-on-error: true
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            modelo:
              - 'model/**'
              - '.pre-commit-config.yaml'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'firebase/**'
              - 'firebase.json'
              - '.github/workflows/ci.yml'

  # ---------------------------------------------------------------- lint del pipeline
  lint-workflow:
    name: Validar el workflow (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: reviewdog/action-actionlint@cfa6a621f27735ccc88d35af9d0608692fd9b9f7 # v1.80.8
        with:
          fail_level: error

  # =======================================================================  MODELO

  modelo-tests:
    name: "Modelo: lint y tests"
    needs: cambios
    if: needs.cambios.outputs.modelo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/requirements*.txt

      # PyTorch para CPU (unos 200 MB en vez de varios GB con CUDA).
      # Misma versión que requirements.txt; actualizarla en PCIT-168.
      - name: Instalar PyTorch (CPU)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        # El motor de puntuación exige 100 % de cobertura (criterio de TA-27).
        run: pytest --cov=scoring --cov-fail-under=100

  # =========================================================================  WEB

  web-tests:
    name: "Web: lint, tests, build y CSP"
    needs: cambios
    if: needs.cambios.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm ci instala exactamente lo del package-lock (sin actualizar nada).
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Lint (oxlint)
        run: npm run lint

      - name: Tests (vitest)
        run: npm test

      - name: Build (vite)
        run: npm run build

      # La CSP de firebase.json debe permitir los scripts en línea del build (PCIT-169).
      - name: Comprobar la CSP
        run: npm run check:csp

  web-reglas:
    name: "Web: reglas de Firestore y Storage"
    needs: cambios
    if: needs.cambios.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Los emuladores de Firebase necesitan Java 21.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Caché de los emuladores
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('web/package-lock.json') }}

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Pruebas de reglas (emuladores)
        run: npm run test:rules

  # ====================================================================  SEGURIDAD

  secretos:
    name: "Seguridad: secretos (gitleaks)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # gitleaks comenta en la PR la línea con el secreto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # todo el historial, no solo el último commit
          persist-credentials: false

      - name: Buscar secretos (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencias-python:
    name: "Seguridad: dependencias Python (pip-audit)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/requirements*.txt

      # Se instala el mismo entorno que el worker (torch de CPU para no bajar varios GB)
      # y se audita lo instalado, incluidas las dependencias indirectas.
      - name: Instalar el entorno del worker
        run: |
          # pip y setuptools vienen con el Python del runner: se actualizan para no auditar herramientas viejas.
          python -m pip install --upgrade pip setuptools
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1
          pip install -r model/requirements-worker.txt -r model/requirements-dev.txt
          pip install pip-audit==2.10.1

      - name: Auditar (pip-audit)
        run: |
          pip-audit --progress-spinner off -f json -o pip-audit.json || true
          python .github/scripts/pip_audit_gate.py pip-audit.json

  dependencias-web:
    name: "Seguridad: dependencias web (npm audit)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Bloquea por vulnerabilidades altas o críticas en lo que llega al navegador.
      - name: Auditar dependencias de producción (npm audit)
        run: npm audit --omit=dev --audit-level=high

      # Las de desarrollo (firebase-tools, vitest...) no llegan a producción: solo se informan.
      - name: Informar dependencias de desarrollo
        run: npm audit --audit-level=critical || echo "::warning::npm audit encontró vulnerabilidades críticas en dependencias de desarrollo"

  revision-dependencias:
    name: "Seguridad: Dependency Review"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # resumen en la PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ------------------------------------------------------------- capa OWASP (nueva)

  owasp-dependency-check:
    # OWASP Dependency-Check (SCA): cruza las dependencias con la base NVD, con su
    # propio catálogo (distinto del que usan pip-audit y npm audit, que miran OSV y
    # la Advisory Database de GitHub). Pensado como segunda opinión, no para cada PR:
    # tarda varios minutos por la base de datos NVD, así que corre en main y los lunes.
    name: "OWASP: Dependency-Check (SCA)"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write # subir el SARIF a Code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # La base de datos NVD pesa varios cientos de MB: se cachea para no bajarla cada vez.
      - name: Caché de la base NVD
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-dependency-check-nvd-${{ github.run_id }}
          restore-keys: owasp-dependency-check-nvd-

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600 # v1.1.0
        with:
          project: AceCam
          path: |
            model/requirements.txt
            model/requirements-worker.txt
            web/package-lock.json
          format: SARIF
          # NVD_API_KEY (opcional, Settings > Secrets): acelera la descarga de la base NVD.
          # Sin ella, el job igual funciona, solo tarda más la primera vez.
          args: >
            --failOnCVSS 9
            --enableRetired
            ${{ secrets.NVD_API_KEY && format('--nvdApiKey {0}', secrets.NVD_API_KEY) || '' }}

      - name: Subir a Code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/dependency-check-report.sarif

  owasp-zap-baseline:
    # OWASP ZAP Baseline (DAST): analiza la web ya publicada en vivo (pasivo, no
    # intrusivo: no envía payloads de ataque, solo mira respuestas y cabeceras).
    # Es la única prueba que corre contra la aplicación real en ejecución, no contra
    # el código: por eso va después del despliegue a producción y solo en main.
    name: "OWASP: ZAP Baseline (DAST)"
    needs: deploy
    if: github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # ZAP puede abrir un issue con el resumen (desactivado abajo)
    steps:
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "https://acecam-e93a2.web.app"
          cmd_options: "-a" # incluye reglas pasivas adicionales
          allow_issue_writing: false # el reporte queda como artefacto, no como issue
          fail_action: false # informativo: no bloquea el pipeline (como Scorecard)

  # -------------------------------------------------------------------------  SAST

  codeql:
    name: "SAST: CodeQL (${{ matrix.language }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # subir los resultados a Code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Consultas de seguridad y de calidad (más hallazgos que el conjunto por defecto).
          queries: security-extended
          config: |
            paths-ignore:
              - web/dist
              - "**/node_modules"
              - model/models

      - name: Analizar
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  scorecard:
    name: "SAST: OpenSSF Scorecard"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # subir el SARIF a Code scanning
      id-token: write # publicar el resultado firmado en scorecard.dev
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ejecutar Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Guardar el resultado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Subir a Code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif

  # ------------------------------------------------------------------------  DEPLOY

  deploy:
    name: "Deploy: Firebase Hosting"
    needs: [web-tests, web-reglas]
    # Solo si hubo algo de web que validar, y las PRs de forks no reciben secretos.
    if: |
      always() && needs.web-tests.result == 'success' && needs.web-reglas.result == 'success'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Producción usa el environment "production" (se pueden exigir aprobaciones en Settings > Environments).
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    permissions:
      contents: read
      checks: write # la acción de Firebase publica el resultado como check
      pull-requests: write # comentario con la URL de vista previa
    steps:
      - name: Comprobar configuración
        id: config
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACECAM }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::warning::Falta el secreto FIREBASE_SERVICE_ACCOUNT_ACECAM: no se despliega (ver docs/devsecops.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.ok == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.config.outputs.ok == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build de producción
        if: steps.config.outputs.ok == 'true'
        working-directory: web
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_USE_FIREBASE_EMULATORS: "false"
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run check:csp

      - name: Publicar en Firebase Hosting
        if: steps.config.outputs.ok == 'true'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACECAM }}
          projectId: ${{ env.FIREBASE_PROJECT }}
          # Vacío en las PRs = canal de vista previa por PR; "live" en main = producción.
          channelId: ${{ github.event_name != 'pull_request' && 'live' || '' }}
          expires: 7d
          # La misma versión de firebase-tools que web/package-lock.json.
          firebaseToolsVersion: 15.34.2

      # Las reglas solo se publican desde main y después de pasar test:rules en la CI.
      # Storage exige el plan Blaze: sus reglas solo se publican con la variable de
      # repositorio DEPLOY_STORAGE_RULES = true. Sin ella (plan Spark) se publican
      # solo las de Firestore, en vez de fallar todo el paso.
      - name: Publicar reglas e índices
        if: steps.config.outputs.ok == 'true' && github.event_name != 'pull_request'
        working-directory: web
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACECAM }}
          DEPLOY_STORAGE_RULES: ${{ vars.DEPLOY_STORAGE_RULES }}
        run: |
          key_file="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$key_file"
          chmod 600 "$key_file"
          trap 'rm -f "$key_file"' EXIT
          targets="firestore:rules,firestore:indexes"
          if [ "$DEPLOY_STORAGE_RULES" = "true" ]; then
            targets="$targets,storage"
          else
            echo "::notice::Reglas de Storage omitidas (requieren el plan Blaze). Define DEPLOY_STORAGE_RULES=true para publicarlas."
          fi
          GOOGLE_APPLICATION_CREDENTIALS="$key_file" npx --no-install firebase deploy \
            --only "$targets" \
            --project "$FIREBASE_PROJECT" --non-interactive --config ../firebase.json
